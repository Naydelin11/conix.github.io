<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conix - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="custom-header text-white py-3 px-4 d-flex justify-content-between align-items-center">
        <h1 class="m-0">Conix</h1>
        
        <nav class="d-flex align-items-center">
            <a href="index.html" class="text-white mx-2">Inicio</a>
            <a href="login.html" class="text-white mx-2">Login</a>
            <a href="registro.html" class="text-white mx-2">Registro</a>
            <a href="timeline.html" class="text-white mx-2">Timeline</a>
    
            <!-- Ícono de usuario con dropdown -->
            <div class="dropdown ms-3">
                <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" type="button" id="userDropdown">
                    <img src="user-icon.jpg" alt="Usuario" width="30" height="30" class="rounded-circle me-2">
                    <span>Mi cuenta</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" id="dropdownMenu">
                    <li><a class="dropdown-item" href="perfil.html">Perfil</a></li>
                    <li><a class="dropdown-item" href="login.html">Cerrar sesión</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="registro-box"> <!-- Agregar esta clase para mantener el mismo diseño -->
                    <h2 class="text-center">Iniciar Sesión</h2>
                    <form>
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Recordarme</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                        <br>
                        <a href="registro.html">Registrarse</a>
                    </div>
                </div> <!-- Cierre de registro-box -->
            </div>
        </div>
    </main>
    
    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p>&copy; 2025 Conix</p>
    </footer>
</body>
</html>
