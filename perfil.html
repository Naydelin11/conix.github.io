<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Conix - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="custom-header text-white py-3 px-4 d-flex justify-content-between align-items-center">
        <h1 class="m-0">Conix</h1>
        
        <nav class="d-flex align-items-center">
            <a href="index.html" class="text-white mx-2">Inicio</a>
            <a href="login.html" class="text-white mx-2">Login</a>
            <a href="registro.html" class="text-white mx-2">Registro</a>
            <a href="timeline.html" class="text-white mx-2">Timeline</a>
    
            <!-- Ícono de usuario con dropdown -->
            <div class="dropdown ms-3">
                <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" type="button" id="userDropdown">
                    <img src="user-icon.jpg" alt="Usuario" width="30" height="30" class="rounded-circle me-2">
                    <span>Mi cuenta</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" id="dropdownMenu">
                    <li><a class="dropdown-item" href="perfil.html">Perfil</a></li>
                    <li><a class="dropdown-item" href="login.html">Cerrar sesión</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
    
    
    
    
    
    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body text-center">
                        <img src="profile.jpg" class="rounded-circle mb-3" width="150" alt="Foto de perfil">
                        <h2>Usuario Demo</h2>
                        <p>@usuario_demo</p>
                        <p>Descripción del perfil del usuario.</p>
                        <p><strong>Seguidores:</strong> 120 | <strong>Seguidos:</strong> 180</p>
                    </div>
                </div>
                <h3 class="mt-4">Publicaciones</h3>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <img src="post1.jpg" class="img-fluid rounded" alt="Publicación">
                        <p class="text-center">100 Likes</p>
                    </div>
                    <div class="col-md-4 mb-3">
                        <img src="post2.jpg" class="img-fluid rounded" alt="Publicación">
                        <p class="text-center">75 Likes</p>
                    </div>
                    <div class="col-md-4 mb-3">
                        <img src="post3.jpg" class="img-fluid rounded" alt="Publicación">
                        <p class="text-center">50 Likes</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p>&copy; 2025 Conix</p>
    </footer>
</body>
</html>
